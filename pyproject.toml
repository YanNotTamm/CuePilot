[project]
name = "cuepilot"
version = "0.1.0"
description = "Intelligent Hot Cue & Beatgrid Generator for Serato and Rekordbox - local-first DJ music preparation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CuePilot" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "mutagen>=1.47",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Optional extras (kept out of the required dependencies on purpose):
# - desktop: the pywebview desktop shell + FastAPI sidecar server.
# - onnx: ONNX stem separation via onnxruntime (core/stems backends).
desktop = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",
]
onnx = [
    "onnxruntime>=1.17",
]

[project.scripts]
cuepilot = "cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# find_packages() equivalent: include every real package instead of a
# hand-maintained list (the old list silently omitted core.stems and
# core.learn, so installed wheels were missing those modules).
include = ["core*", "cli*"]
namespaces = false
